<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Package-Am — You're Offline</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #FFF8F4;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 24px;
      text-align: center;
    }
    .icon {
      width: 80px; height: 80px;
      background: linear-gradient(135deg, #FF5A1F, #D94510);
      border-radius: 24px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px;
      font-size: 40px;
    }
    h1 { font-size: 1.75rem; font-weight: 800; color: #1A0A00; margin-bottom: 8px; }
    p  { color: #9A7055; font-size: 0.95rem; line-height: 1.6; max-width: 320px; margin: 0 auto 32px; }
    button {
      background: linear-gradient(135deg, #FF5A1F, #D94510);
      color: white; border: none; cursor: pointer;
      padding: 14px 32px; border-radius: 999px;
      font-size: 0.9rem; font-weight: 700;
    }
    button:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="icon">📦</div>
  <h1>You're Offline</h1>
  <p>No internet connection detected. Check your connection and try again — your cashback is waiting!</p>
  <button onclick="location.reload()">Try Again</button>
</body>
</html>
